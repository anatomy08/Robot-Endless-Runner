<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="portrait">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      :root {
        color-scheme: dark;
        background: #101418;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #101418;
      }

      body {
        display: grid;
        place-items: center;
      }

      #unity-container {
        position: relative;
        width: min(100vw, 56.25vh);
        height: min(100vh, 177.7778vw);
        overflow: hidden;
        background: {{{ BACKGROUND_COLOR }}};
        box-shadow: 0 0 32px rgba(0, 0, 0, 0.45);
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: 0;
        background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}};
        touch-action: none;
      }

      #loading {
        position: absolute;
        left: 12%;
        right: 12%;
        bottom: 8%;
        height: 6px;
        overflow: hidden;
        background: #293138;
      }

      #loading-progress {
        width: 0;
        height: 100%;
        background: #42d47f;
        transition: width 120ms linear;
      }

      #status {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: calc(8% + 18px);
        color: #f4f7f5;
        font: 600 14px/1.4 Arial, sans-serif;
        text-align: center;
      }

      @media (max-width: 700px), (pointer: coarse) {
        #unity-container {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="unity-container">
      <canvas
        id="unity-canvas"
        width="{{{ WIDTH }}}"
        height="{{{ HEIGHT }}}"
        tabindex="-1"
        aria-label="{{{ PRODUCT_NAME }}}"></canvas>
      <div id="status">Loading</div>
      <div id="loading"><div id="loading-progress"></div></div>
    </main>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const status = document.querySelector("#status");
      const loading = document.querySelector("#loading");
      const progress = document.querySelector("#loading-progress");
      const portraitRatio = 9 / 16;

      function resizePortraitContainer() {
        const availableWidth = window.innerWidth;
        const availableHeight = window.innerHeight;
        const width = Math.min(availableWidth, availableHeight * portraitRatio);
        const height = width / portraitRatio;

        container.style.width = `${Math.floor(width)}px`;
        container.style.height = `${Math.floor(height)}px`;
      }

      resizePortraitContainer();
      window.addEventListener("resize", resizePortraitContainer);
      window.visualViewport?.addEventListener("resize", resizePortraitContainer);

      const config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      createUnityInstance(canvas, config, (value) => {
        progress.style.width = `${Math.round(value * 100)}%`;
      }).then(() => {
        status.remove();
        loading.remove();
        canvas.focus();
      }).catch((message) => {
        status.textContent = message;
        loading.remove();
      });
    </script>
  </body>
</html>
